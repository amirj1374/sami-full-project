# Standalone backend stack: PostgreSQL + the Spring Boot API.
#
# Usage:
#   cp .env.example .env      # adjust if needed
#   docker compose up --build
#
# API:      http://localhost:8080
# Swagger:  http://localhost:8080/swagger-ui.html
#
# Flyway runs all migrations on first boot and a default admin is
# seeded (see BOOTSTRAP_ADMIN_* in .env).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sami}
      POSTGRES_USER: ${POSTGRES_USER:-sami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sami}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sami} -d ${POSTGRES_DB:-sami}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sami}
      DB_USERNAME: ${POSTGRES_USER:-sami}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sami}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-env-a-very-long-dev-only-secret-value-32b+}
      JWT_ISSUER: ${JWT_ISSUER:-sami}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@sami.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin123!}
      STORAGE_BASE_PATH: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8080:8080"

volumes:
  db-data:
  uploads:
