# nginx config for serving the SPA and proxying API calls to the backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep the reverse proxy aligned with Spring multipart limits so a valid
    # accounting workbook reaches the authenticated import endpoint.
    client_max_body_size 21m;

    # Gzip static assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA history-mode fallback: unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API to the backend service (name resolved on the compose network).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        # Staging an audited accounting workbook is intentionally synchronous;
        # do not discard its bounded database transaction at nginx's short
        # default read timeout.
        proxy_connect_timeout 15s;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA metadata and worker must be revalidated so updates are discovered.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Public deployment smoke check backed by Spring Boot Actuator.
    location = /health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
