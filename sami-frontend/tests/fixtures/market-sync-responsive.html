<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Market Sync responsive fixture</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:14px Vazirmatn,Arial,sans-serif}.page{max-width:1280px;margin:auto;padding:20px}.head,.cards,.tabs,.toolbar{display:flex;gap:12px;align-items:center}.head{justify-content:space-between;flex-wrap:wrap}.button{border:0;border-radius:8px;padding:10px 14px;background:#165dff;color:white}.cards{margin:20px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.card,.panel{background:white;border:1px solid #e0e5ef;border-radius:12px;padding:16px}.metric{font-size:25px;font-weight:700}.tabs{overflow:auto;white-space:nowrap;padding-bottom:8px}.tab{padding:9px 12px;border-radius:8px;background:#e8eefc}.panel{margin-top:10px;overflow:hidden}.toolbar{justify-content:space-between;flex-wrap:wrap}.table-wrap{overflow:auto}table{width:100%;min-width:720px;border-collapse:collapse}th,td{text-align:start;padding:12px;border-bottom:1px solid #edf0f5}.state{color:#a15c00;background:#fff3d6;border-radius:20px;padding:4px 8px}.notice{margin-top:12px;padding:12px;border-radius:8px;background:#fff4e5;color:#7b4b00}@media(max-width:700px){.page{padding:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.head h1{font-size:21px;margin:4px 0}.button{width:100%}.toolbar>*{width:100%}.panel{padding:12px}}@media(max-width:380px){.cards{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="page">
  <header class="head"><div><h1 data-fa="همگام‌سازی بازار و قیمت‌گذاری" data-en="Market Sync & Pricing"></h1><div data-fa="کنترل منبع، قیمت و انتشار سیم‌کارت" data-en="Control SIM sources, pricing and publication"></div></div><button class="button" data-fa="اجرای همگام‌سازی" data-en="Run synchronization"></button></header>
  <section class="cards"><article class="card"><div data-fa="منابع" data-en="Sources"></div><div class="metric">2</div></article><article class="card"><div data-fa="محصولات" data-en="Products"></div><div class="metric">48</div></article><article class="card"><div data-fa="منتشرشده" data-en="Published"></div><div class="metric">0</div></article><article class="card"><div data-fa="خطاها" data-en="Errors"></div><div class="metric">1</div></article></section>
  <nav class="tabs"><span class="tab" data-fa="نمای کلی" data-en="Overview"></span><span class="tab" data-fa="منابع" data-en="Sources"></span><span class="tab" data-fa="قیمت‌گذاری" data-en="Pricing"></span><span class="tab" data-fa="قوانین انتشار" data-en="Publication rules"></span><span class="tab" data-fa="تاریخچه" data-en="History"></span></nav>
  <section class="panel"><div class="toolbar"><strong data-fa="وضعیت منابع" data-en="Source status"></strong><span class="state" data-fa="رابط انتشار تنظیم نشده" data-en="Publication connector not configured"></span></div><div class="notice" data-fa="انتشار تا زمان پیکربندی رابط وب به‌صورت ایمن متوقف می‌ماند." data-en="Publication remains safely blocked until the website connector is configured."></div><div class="table-wrap"><table><thead><tr><th data-fa="منبع" data-en="Source"></th><th data-fa="وضعیت" data-en="Status"></th><th data-fa="آخرین اجرا" data-en="Last run"></th><th data-fa="قیمت‌گذاری" data-en="Pricing"></th></tr></thead><tbody><tr><td>samistore.rond.ir</td><td data-fa="غیرفعال" data-en="Disabled"></td><td>—</td><td data-fa="پروفایل اصلی" data-en="Primary profile"></td></tr></tbody></table></div></section>
</main><script>const en=new URLSearchParams(location.search).get('lang')==='en';document.documentElement.lang=en?'en':'fa';document.documentElement.dir=en?'ltr':'rtl';for(const el of document.querySelectorAll('[data-fa]'))el.textContent=el.dataset[en?'en':'fa'];</script></body></html>
